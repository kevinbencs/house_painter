name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run test        # vitest run

  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # .env is gitignored, so the build and the e2e server get these from
    # the repository secrets (Settings → Secrets and variables → Actions).
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_SECRET_TWOFA: ${{ secrets.JWT_SECRET_TWOFA }}
      JWT_SECRET_URL: ${{ secrets.JWT_SECRET_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      RESEND: ${{ secrets.RESEND }}
      EMAIL: ${{ secrets.EMAIL }}
      URL: ${{ secrets.URL }}
      GOOGLE_PLACE_API: ${{ secrets.GOOGLE_PLACE_API }}
      PLACE_ID: ${{ secrets.PLACE_ID }}
      DISCORD: ${{ secrets.DISCORD }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build      # produces the build that `next start` serves
      - run: npm run test:e2e    # playwright starts the server via your launcher
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30